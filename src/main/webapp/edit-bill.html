<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Bill - Cafeteria</title>

    <link rel="stylesheet" href="resources/css/shared.css">
    <link rel="stylesheet" href="resources/css/new-bill.css">
    <link rel="stylesheet" href="resources/css/edit-bill.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-brand">Cafeteria Manager</div>
    <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li class="dropdown">
            <a href="#" class="dropbtn active">Bill Management ▾</a>
            <div class="dropdown-content">
                <a href="new-bill.html">New Bill</a>
                <a href="edit-bill.html" class="active">Edit Bill</a>
                <a href="print-bill.html">Print Bill</a>
            </div>
        </li>
    </ul>
</nav>

<div class="main-content container">

    <!-- 🔍 SEARCH -->
    <div class="bill-search-box">

        <div class="search-group">
            <label>BILL ID:</label>
            <div class="search-input-wrapper">
                <input type="text" id="billIdSearch" placeholder="Enter Bill ID">
                <button class="search-icon-btn" onclick="loadBillForEdit()">🔍</button>
            </div>
        </div>

        <div class="search-group">
            <label>PROGRAMME UID:</label>
            <div class="search-input-wrapper">
                <input type="text" id="searchProgramUid" placeholder="Enter UID">
                <input type="text" id="searchProgramYear" value="2025" class="year-input">
                <button class="search-icon-btn" onclick="loadBillByProgramUid()">🔍</button>
            </div>
        </div>

        <button class="btn btn-danger" onclick="window.location.href='program-report.html'">
            Report
        </button>
    </div>

    <!-- 🔽 EDIT BILL UI -->
    <div id="editBillContainer" style="display:none;">

        <!-- PROGRAM DETAILS -->
        <div class="details-section">

            <div class="program-details-panel">
                <div class="panel-row">
                    <label class="panel-label">PROGRAMME UID:</label>
                    <input type="text" id="programUid" class="input-field">
                    <input type="text" id="programYear" value="2025" class="input-field small-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">PROGRAMME CALL ID:</label>
                    <input type="text" id="programCallId" class="input-field full-width-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">PROG NO:</label>
                    <input type="text" id="progNo" class="input-field full-width-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">PROGRAMME NAME:</label>
                    <input type="text" id="programName" class="input-field full-width-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">SESSION:</label>
                    <input type="text" id="sessionName" class="input-field full-width-input">
                </div>
            </div>

            <div class="schedule-details-panel">
                <div class="panel-row multi-col">
                    <div class="col-item"><label class="panel-label">DATE</label></div>
                    <div class="col-item">
                        <label class="sub-label">FROM</label>
                        <input type="date" id="dateFrom" class="input-field">
                    </div>
                    <div class="col-item">
                        <label class="sub-label">TO</label>
                        <input type="date" id="dateTo" class="input-field">
                    </div>
                </div>

                <div class="panel-row">
                    <label class="panel-label">DURATION:</label>
                    <input type="text" id="duration" class="input-field full-width-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">CATEGORY:</label>
                    <input type="text" id="category" class="input-field full-width-input">
                </div>

                <div class="panel-row">
                    <label class="panel-label">COORDINATOR:</label>
                    <input type="text" id="coordinator" class="input-field full-width-input">
                </div>
            </div>
        </div>

        <!-- BILLING -->
        <div class="billing-section">

            <div class="billing-header">
                <div class="total-rows-indicator">
                    Total Rows :
                    <span id="totalRowsCount" class="badge-count">0</span>
                </div>

                <div class="total-rows-indicator">
                    Unsaved Rows :
                    <span id="unsavedRowsCount" class="badge-count" style="background:red">0</span>
                </div>
            </div>

            <div class="table-container">
                <button class="add-bill-btn" onclick="openAddModal()">Add Bill</button>

                <table id="billTable">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Service Date</th>
                            <th>Served Time</th>
                            <th>Menu Item</th>
                            <th>Quantity</th>
                            <th>Rate</th>
                            <th>Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="action-footer">
                <button class="btn btn-danger" onclick="window.location.href='program-report.html'">
                    Delete Bill
                </button>
                <button class="btn btn-primary" onclick="saveBill()">
                    Save Bill
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ADD ITEM MODAL (same as new-bill) -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeAddModal()">&times;</span>
        <h2>Add menu items</h2>

        <form id="addItemForm" class="add-grid">
            <div class="form-group">
                <label>Service Date</label>
                <input type="date" id="serviceDate">
            </div>
            <div class="form-group">
                <label>Served Time</label>
                <input type="time" id="servedTime">
            </div>
            <div class="form-group span-2-col">
                <label>Menu Item</label>
                <select id="itemSelect"></select>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="itemQty" value="1">
            </div>
            <div class="form-group span-2-col">
                <label>Rate</label>
                <input type="text" id="displayPrice" disabled>
            </div>

            <button type="submit" class="btn btn-primary full-width">
                Add to Bill
            </button>
        </form>
    </div>
</div>

<script src="resources/js/edit-bill.js"></script>
</body>
</html>
